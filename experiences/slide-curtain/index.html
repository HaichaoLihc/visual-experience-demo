<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slide Curtain</title>
  <meta name="description" content="Photographs mounted as 35 mm slides, hung in chains from a curtain rod and lit from behind.">
  <meta name="theme-color" content="#080706">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23221f1b'/%3E%3Crect x='8' y='10' width='16' height='12' rx='1' fill='%23f3e6c8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="A curtain of photographic slides lit from behind. Brush across it to move the slides and select one to hold it up to the light. Arrow keys choose a slide; Enter opens it."></canvas>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <dialog id="box" class="box" aria-labelledby="box-title">
    <figure>
      <img id="box-img" alt="">
      <figcaption><strong id="box-title"></strong><span id="box-credit"></span><a id="box-source" target="_blank" rel="noopener">Source ↗</a></figcaption>
    </figure>
    <button id="box-close" class="close" type="button" aria-label="Close">×</button>
    <button id="box-prev" class="prev" type="button" aria-label="Previous photo">‹</button>
    <button id="box-next" class="next" type="button" aria-label="Next photo">›</button>
  </dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
