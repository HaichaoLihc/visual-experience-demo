<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfcfc">
  <meta name="description" content="An interactive collection of photographs.">
  <title>Card Gallery</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='12' y='6' width='15' height='23' rx='3' fill='%23999'%3E%3C/rect%3E%3Crect x='7' y='4' width='15' height='23' rx='3' fill='%23ddd'%3E%3C/rect%3E%3Crect x='2' y='2' width='15' height='23' rx='3' fill='%234a4956'%3E%3C/rect%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="viewport" aria-label="Interactive card gallery">
    <nav class="navigation" aria-label="Views">
      <button type="button" data-chapter="intro">Ring</button>
      <button type="button" data-chapter="vision" aria-current="page">Arc</button>
      <button type="button" data-chapter="intelligence">Unfold</button>
    </nav>
    <div id="stage" class="stage" aria-label="Scroll, drag, or use arrow keys to browse" tabindex="0">
      <div id="industry-cards"></div>
      <div id="process-cards"></div>
    </div>
    <div class="intro-copy" id="intro-copy">
      <p>One collection. Many perspectives.</p>
      <button id="explore" type="button">Explore</button>
    </div>
    <div class="caption" id="caption" aria-live="polite">
      <p class="eyebrow" id="eyebrow">CARD GALLERY</p>
      <p class="category" id="category">Photo 11</p>
      <p class="description" id="description">Scroll or drag to explore.<br>You can also use arrow keys.</p>
    </div>
    <div class="progress-rail" aria-hidden="true"><span id="progress-thumb"></span></div>
    <input class="progress" id="progress" type="range" min="0" max="1000" value="650" aria-label="Browse cards">
    <div class="cursor" id="cursor" aria-hidden="true"></div>
    <p class="sr-only" id="instructions">Scroll or drag to explore. Arrow keys browse; Home and End jump; Escape returns to the arc.</p>
    <div class="error" id="error" hidden>Photos could not load. <button onclick="location.reload()">Retry</button></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
