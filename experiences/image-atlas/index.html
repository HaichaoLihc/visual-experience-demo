<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fafcfb">
<meta name="description" content="A spatial photo archive with sample dates.">
<title>Image Atlas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%236b7975' stroke-width='1.5'%3E%3Cellipse cx='16' cy='16' rx='14' ry='12'/%3E%3Cellipse cx='16' cy='16' rx='10' ry='8'/%3E%3Cellipse cx='16' cy='16' rx='5' ry='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="space" aria-label="Drag to explore photos; scroll through time."><div id="world"></div></main>
<div class="horizon" aria-hidden="true"></div>
<header class="masthead"><button id="home" aria-label="All photographs"><svg viewBox="0 0 40 40" width="35" height="35" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".9"><ellipse cx="20" cy="20" rx="17" ry="15"/><ellipse cx="20" cy="20" rx="12" ry="10"/><ellipse cx="20" cy="20" rx="6" ry="5"/></g></svg><span>Image Atlas<small>PHOTO STUDY</small></span></button><p id="archive-count"></p></header>
<div class="search-shell"><form id="search-form" role="search" autocomplete="off"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.3"/></svg><input id="search" type="search" placeholder="Find a moment…" aria-label="Search photos by year or description" aria-controls="suggestions" aria-expanded="false" spellcheck="false"><button type="button" id="clear" aria-label="Clear search" hidden>×</button><button type="submit" class="enter" aria-label="Search">↵</button></form><div id="suggestions" hidden></div></div>
<div class="time-note" id="time-note"><span id="period">ALL THE DAYS</span><p id="period-caption">Days, gathered in circles.</p></div>
<div class="selection" id="selection" hidden><p id="selection-meta"></p><h1 id="selection-title"></h1><div class="photo-controls"><button id="previous" aria-label="Previous photo">←</button><button id="back">Back to atlas <kbd>esc</kbd></button><button id="next" aria-label="Next photo">→</button></div></div>
<footer class="footer"><nav id="timeline" aria-label="Browse by year"></nav><p class="instructions">Drag to explore <span>·</span> Scroll through time <span>·</span> Click to focus</p></footer>
<p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
<noscript><p class="no-script">Enable JavaScript to explore.</p></noscript>
<script type="module" src="app.js"></script>
</body></html>
