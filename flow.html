<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f1">
  <title>Flow — placeholder</title>
  <link rel="stylesheet" href="style.css?v=use-popup">
</head>
<body class="flow-route">
  <header class="header">
    <a class="logo" href="./">placeholder</a>
    <nav class="view-nav" aria-label="Discover">
      <a href="./" aria-current="page">Flow</a>
      <a href="explore.html">Explore</a>
    </nav>
    <div class="header-actions">
      <a class="profile" href="profile.html" aria-label="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5.5 20v-1.5a6.5 6.5 0 0 1 13 0V20"/></svg>
      </a>
    </div>
  </header>
  <main class="flow-page" aria-label="Experience feed">
    <div class="flow-stage" tabindex="0" role="region" aria-label="Swipe or scroll to browse experiences" aria-roledescription="carousel" aria-describedby="flow-help"></div>
    <footer class="flow-footer">
      <div class="flow-caption" aria-live="polite"><span class="flow-number"></span><span class="flow-title"></span></div>
      <div class="flow-position" aria-label="Choose an experience"></div>
      <div class="flow-actions">
        <button class="feed-prev" type="button" aria-label="Previous experience">Prev</button>
        <button class="feed-next" type="button" aria-label="Next experience">Next</button>
        <button class="use" type="button" aria-haspopup="dialog">Use<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button>
      </div>
    </footer>
    <span class="sr-only" id="flow-help">Use Previous or Next to browse. You can also swipe or scroll below the work, or use arrow keys while the feed has focus. Each work’s own controls are always available.</span>
  </main>
  <script src="experiences.js?v=use-popup"></script>
  <script src="copy-source.js?v=use-popup"></script>
  <script src="flow.js?v=use-popup"></script>
</body>
</html>
